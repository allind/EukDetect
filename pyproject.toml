[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eukdetect"
dynamic = ["version"]
authors = [
    { name = "Abigail Lind" }
]
description = "Detect eukaryotes from shotgun metagenomic data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "biopython",
    "ete3",
    "six",
    "pysam",
    "pyyaml",
    "snakemake>=8",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/allind/EukDetect"

[project.scripts]
eukdetect = "eukdetect.wrappers.main:main"
eukdetect-normalize = "eukdetect.util.normalize_rpks:main"

[tool.setuptools.dynamic]
version = { attr = "eukdetect.__version__" }

[tool.setuptools.packages.find]
include = ["eukdetect*"]

[tool.setuptools.package-data]
eukdetect = ["rules/*.rules", "envs/*.yml"]
