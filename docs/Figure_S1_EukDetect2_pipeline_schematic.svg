<rect x="471" y="722" width="430" height="148" rx="3" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="686" y="746" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1A1A1A" >Species disambiguation</text>
<text x="686" y="770" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1A1A1A" >Taxa that compete for reads are grouped by</text>
<text x="686" y="786" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1A1A1A" >ANI ≥ 80 OR a shared NCBI genus</text>
<text x="686" y="812" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1A1A1A" >Within a group, a Mann-Whitney test on read identity</text>
<text x="686" y="828" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1A1A1A" >(α = 0.05) and an abundance-scaled median gap decide</text>
<text x="686" y="844" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1A1A1A" >whether a taxon keeps its reads or hands them over</text>
